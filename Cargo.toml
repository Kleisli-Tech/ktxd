[package]
name = "ktxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kleisli Technologies FZ-LLC"]
description = "A local Responses API compatibility proxy for Codex CLI and Chat Completions backends."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Kleisli-Tech/ktxd"
homepage = "https://github.com/Kleisli-Tech/ktxd"
documentation = "https://docs.rs/ktxd"
keywords = ["codex", "responses-api", "chat-completions", "proxy"]
categories = ["api-bindings", "network-programming", "web-programming"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
